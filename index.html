<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Taiwan × Japan Business Support</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
    }

    header {
      padding: 24px 8%;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: bold;
      font-size: 20px;
    }

    .language {
      font-size: 14px;
    }

    main {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: clamp(38px, 6vw, 72px);
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      color: #555;
    }

    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #eee;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    Taiwan × Japan
  </div>

  <div class="language">
    日本語 ｜ 繁體中文 ｜ EN
  </div>
</header>

<main>
  <div>
    <h1>Connecting Taiwan & Japan</h1>

    <p>
      台湾企業と日本メーカーの<br>
      新しいビジネスをつなぐ。
    </p>
  </div>
</main>

<footer>
  © 2026 Taiwan-Japan Business Support
</footer>

</body>
</html>
